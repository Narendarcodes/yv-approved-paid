name: Keep warm (judging window)

# Keeps the Render API awake from the judging window (Dec 1-15 2026 IST, with a day of
# buffer: 2026-11-30 .. 2026-12-16 IST) through 2027-01-31 IST, in case judging is
# postponed. The API alone is ~744 h in a 31-day month, under Render's 750 free hours.
# The deals agent is NOT pinged here: the API's own tick (apps/api/src/agent/routing.js)
# pings it every 4 min while the month's Render hours are under RENDER_HOURS_SWITCH, then
# routes agent calls to the Azure fallback (AGENT_FALLBACK_URL) until the next UTC month.
# GitHub cron can skip hours, so each run is one long job that pings every 4 minutes
# for ~5h50m, and a new run starts every 5 hours: runs overlap, and a skipped or late
# schedule is covered by the run still going. Outside the window every run is a quick no-op.
# keep-warm.yml (every 10 min, all year) keeps pinging the API too; pings are only wake-ups,
# Render bills wall-clock instance hours, so the overlap costs nothing extra.
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions: {}

# A unique group per run lets a new run overlap the one still pinging; nothing is cancelled.
concurrency:
  group: keep-warm-judging-${{ github.run_id }}
  cancel-in-progress: false

env:
  WINDOW_START: "2026-11-30" # first IST day pinged (judging Dec 1-15, a day of buffer)
  JUDGING_END: "2026-12-16" # end of the judging window, for the log line only
  WINDOW_END: "2027-01-31" # last IST day pinged (stops after 23:59 IST), covers a postponed judging
  API_URL: https://yv-approved-paid-api.onrender.com/api/v1/health

jobs:
  ping:
    name: Ping API
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Inside the judging window?
        id: window
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          if [[ "$today" < "$WINDOW_START" || "$today" > "$WINDOW_END" ]]; then
            echo "Outside the keep-warm window ($WINDOW_START..$WINDOW_END IST); today is $today IST. Nothing to do."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "$today" > "$JUDGING_END" ]]; then
              echo "Inside the keep-warm window, past judging ($JUDGING_END); today is $today IST."
            else
              echo "Inside the keep-warm window (judging); today is $today IST."
            fi
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping every 4 minutes for ~5h50m
        if: steps.window.outputs.active == 'true'
        run: |
          deadline=$(( $(date +%s) + 350 * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            today=$(TZ=Asia/Kolkata date +%F)
            if [[ "$today" > "$WINDOW_END" ]]; then
              echo "Past $WINDOW_END 23:59 IST; stopping."
              break
            fi
            now=$(TZ=Asia/Kolkata date '+%F %T IST')
            api=$(curl -sS --max-time 60 -o /dev/null -w "%{http_code} %{time_total}s" "$API_URL" 2>&1 || true)
            echo "$now  api: ${api:-no response}"
            sleep 240
          done
