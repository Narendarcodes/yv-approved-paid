name: Keep warm (judging window)

# Keeps BOTH Render free services (API + deals agent) awake for the judging window,
# Dec 1-15 2026 IST, with a day of buffer each side (2026-11-30 .. 2026-12-16 IST).
# GitHub cron can skip hours, so each run is one long job that pings every 4 minutes
# for ~5h50m, and a new run starts every 5 hours: runs overlap, and a skipped or late
# schedule is covered by the run still going. Outside the window every run is a quick no-op.
# Note: two services awake 24/7 use ~48 Render free instance hours a day (750/month per
# workspace), so the December allowance runs close to its limit by Dec 16.
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions: {}

# A unique group per run lets a new run overlap the one still pinging; nothing is cancelled.
concurrency:
  group: keep-warm-judging-${{ github.run_id }}
  cancel-in-progress: false

env:
  WINDOW_START: "2026-11-30" # first IST day pinged
  WINDOW_END: "2026-12-16" # last IST day pinged (stops after 23:59 IST)
  API_URL: https://yv-approved-paid-api.onrender.com/api/v1/health
  AGENT_URL: https://yv-deals-agent.onrender.com/health

jobs:
  ping:
    name: Ping API + deals agent
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Inside the judging window?
        id: window
        run: |
          today=$(TZ=Asia/Kolkata date +%F)
          if [[ "$today" < "$WINDOW_START" || "$today" > "$WINDOW_END" ]]; then
            echo "Outside the keep-warm window ($WINDOW_START..$WINDOW_END IST); today is $today IST. Nothing to do."
            echo "active=false" >> "$GITHUB_OUTPUT"
          else
            echo "Inside the keep-warm window; today is $today IST."
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping every 4 minutes for ~5h50m
        if: steps.window.outputs.active == 'true'
        run: |
          deadline=$(( $(date +%s) + 350 * 60 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            today=$(TZ=Asia/Kolkata date +%F)
            if [[ "$today" > "$WINDOW_END" ]]; then
              echo "Past $WINDOW_END 23:59 IST; stopping."
              break
            fi
            now=$(TZ=Asia/Kolkata date '+%F %T IST')
            api=$(curl -sS --max-time 60 -o /dev/null -w "%{http_code} %{time_total}s" "$API_URL" 2>&1 || true)
            agent=$(curl -sS --max-time 60 -o /dev/null -w "%{http_code} %{time_total}s" "$AGENT_URL" 2>&1 || true)
            echo "$now  api: ${api:-no response}  agent: ${agent:-no response}"
            sleep 240
          done
