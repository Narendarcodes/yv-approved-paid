name: Keep warm

# Render free instances sleep after ~15 min idle; a judge's first click then waits
# for a cold start. Ping only the API every 10 minutes: Render's 750 free hours are
# per workspace, so keeping both services awake (~1,440 h/month) would exhaust them
# mid-month and suspend everything. The deals agent is kept warm by the API itself
# (apps/api/src/agent/routing.js) only while the month's Render hours allow, then calls
# go to the Azure fallback. keep-warm-judging.yml adds a robust 4-min API ping from
# Nov 30 2026 to Jan 31 2027 IST.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping API health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API health
        run: curl -fsS --max-time 90 -o /dev/null -w "api %{http_code} %{time_total}s\n" https://yv-approved-paid-api.onrender.com/api/v1/health || true
