name: CI

on:
  push:
    branches: [main, develop, "feature/**", "feat/**", "fix/**", "chore/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Node 24 everywhere, matching the node:24-alpine Dockerfiles (native .ts type
# stripping for incremental TypeScript, ADR-0013).
env:
  NODE_VERSION: "24"
  # Root `npm ci` runs `prepare: husky || true`; HUSKY=0 makes it a no-op in CI.
  HUSKY: "0"

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (tree + history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --no-banner --config .gitleaks.toml --redact

  api:
    name: API - lint, typecheck, test, boundaries (apps/api)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "${{ env.NODE_VERSION }}",
            cache: npm,
            cache-dependency-path: "apps/api/package-lock.json",
          }
      - name: Install MongoDB deps (libcrypto.so.1.1 for mongodb-memory-server)
        # archive.ubuntu.com is sometimes unreachable from hosted runners: try mirrors, with timeouts
        run: |
          deb=libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          for base in http://archive.ubuntu.com/ubuntu http://azure.archive.ubuntu.com/ubuntu http://mirrors.edge.kernel.org/ubuntu http://mirror.math.princeton.edu/pub/ubuntu; do
            wget -q --timeout=20 --tries=2 -O "$deb" "$base/pool/main/o/openssl/$deb" && break
            rm -f "$deb"
          done
          test -s "$deb"
          sudo dpkg -i "$deb"
          rm "$deb"
      - run: npm ci --no-audit --no-fund
      - name: Lint (eslint)
        run: npm run lint
      - name: Typecheck (tsc --noEmit; allowJs, checkJs off)
        run: npm run typecheck
      - name: Test (jest)
        run: npm test
      - name: Audit production dependencies (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high
      - name: Install root tooling (dependency-cruiser)
        working-directory: .
        run: npm ci --no-audit --no-fund
      - name: Deep-module boundaries (dependency-cruiser)
        working-directory: .
        run: npm run lint:boundaries

  web:
    name: Web - lint, typecheck + build (apps/web)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "${{ env.NODE_VERSION }}",
            cache: npm,
            cache-dependency-path: "apps/web/package-lock.json",
          }
      - run: npm ci --no-audit --no-fund
      - name: Lint (eslint; warnings allowed)
        run: npm run lint
      - name: Typecheck + build (tsc -b && vite build)
        run: npm run build

  agent:
    name: Agent - pytest (services/agent)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install ffmpeg (video check tests need ffmpeg/ffprobe)
        timeout-minutes: 12
        # the Ubuntu archive is often unreachable from hosted runners (the step hung or failed with
        # every mirror): one short apt try, then the static BtbN build from GitHub releases into /usr/local/bin
        run: |
          set +e
          opts="-o Acquire::http::Timeout=15 -o Acquire::Retries=1"
          timeout 120 sudo apt-get $opts update -qq && timeout 180 sudo apt-get $opts install -y -qq --no-install-recommends ffmpeg
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then ffmpeg -version | sed -n 1p; exit 0; fi
          echo "apt ffmpeg unavailable; using the BtbN static build"
          set -e
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          for i in 1 2 3; do
            curl -fsSL --retry 3 --retry-delay 5 --max-time 240 -o /tmp/ffmpeg.tar.xz "$url" && break
            sleep 10
          done
          mkdir -p /tmp/ffmpeg && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg --strip-components=1
          sudo install -m 0755 /tmp/ffmpeg/bin/ffmpeg /tmp/ffmpeg/bin/ffprobe /usr/local/bin/
          ffmpeg -version | sed -n 1p
          ffprobe -version | sed -n 1p
      - run: pip install -r requirements.txt -r requirements-media.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Golden-question evals are well-formed
        run: python -c "import json;q=json.load(open('evals/golden.json'))['questions'];assert len(q)>=6"

  contracts:
    name: Contracts - codegen drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install datamodel-code-generator==0.84.0
      - run: cd contracts && npm ci --no-audit --no-fund
      - name: Regenerate TS + Pydantic and fail on drift
        run: cd contracts && npm run check

  docker:
    name: Docker - build images (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build apps/web image (same-origin /api/v1 default)
        run: docker build -t yv-web:ci apps/web
      - name: Build apps/api image
        run: docker build -t yv-api:ci apps/api
      - name: Build lean deal-agent image (Render free, services/agent/Dockerfile.deals)
        run: docker build -f services/agent/Dockerfile.deals -t yv-deals-agent:ci services/agent
